<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kurban Bayramın Kutlu Olsun BAYRAK AİLESİ 🌙</title>
  <meta name="description" content="Kurban Bayramı kutlama sayfası" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cinzel+Decorative:wght@400;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Loading -->
  <div id="loader">
    <div class="loader-inner">
      <span class="loader-crescent">☪</span>

    </div>
  </div>

  <!-- Three.js canvas -->
  <canvas id="three-canvas"></canvas>

  <!-- UI overlay -->
  <div id="ui-overlay">
    <div id="star-field"></div>

    <!-- Background title (small, subtle) -->
    <div id="bg-title">
      <span class="line1">✦ &nbsp; K U R B A N &nbsp; B A Y R A M I &nbsp; ✦</span>
      <span class="line2">☪ &nbsp; Mübarek olsun &nbsp; ☪</span>
    </div>

    <!-- Floating emojis -->
    <div id="float-emojis"></div>

    <!-- Explosion text (appears after candy bursts) -->
    <div id="explosion-text">
      <span class="main-msg">Kurban Bayramın Kutlu Olsun BAYRAK Ailesi</span>
      <span class="sub-msg">🌙 Mübarek olsun, bereket getirsin 🤲</span>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
